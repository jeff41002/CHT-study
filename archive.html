<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷屆試題｜中華電信備考筆記</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f7fa;
      color: #172e40;
      font: 1rem/1.65 "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    .wrap { width: min(920px, 92%); margin-inline: auto; }
    header { background: #12304a; color: white; }
    .topbar, nav, .filters, .actions {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
    }
    .topbar { justify-content: space-between; padding-block: 14px; }
    header a { color: white; text-decoration: none; }
    .brand { font-size: 1.15rem; font-weight: 700; }
    nav a { padding: 5px 2px; }
    nav a:hover, nav a[aria-current="page"] {
      text-decoration: underline; text-underline-offset: 5px;
    }
    main { padding-block: 32px 44px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); }
    .intro, .meta, #summary { color: #526779; }
    .intro { margin: 6px 0 20px; }
    .panel {
      padding: 20px; border: 1px solid #d5e1e9;
      border-radius: 12px; background: white;
    }
    .filters label { display: inline-flex; align-items: center; gap: 8px; }
    select {
      max-width: 100%; padding: 8px; border: 1px solid #aebfcb;
      border-radius: 6px; background: white; color: #172e40; font: inherit;
    }
    #summary { margin: 16px 0 6px; }
    .paper {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; padding: 18px 0; border-top: 1px solid #d5e1e9;
    }
    .paper:last-child { padding-bottom: 0; }
    .paper h2 { margin: 0; font-size: 1.12rem; }
    .meta { margin: 2px 0 0; }
    .actions a { display: inline-block; padding-block: 8px; }
    .primary {
      padding-inline: 16px; border-radius: 7px; background: #075985;
      color: white; text-decoration: none; font-weight: 700;
    }
    .primary:hover { background: #12304a; }
    .secondary { color: #075985; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid #d88a0a; outline-offset: 3px; }
    @media (max-width: 600px) {
      main { padding-top: 24px; }
      .panel { padding: 16px; }
      .paper { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <a class="brand" href="index.html">中華電信備考筆記</a>
      <nav aria-label="主選單">
        <a href="index.html">首頁</a>
        <a href="resources.html">學習資源</a>
        <a href="archive.html" aria-current="page">歷屆試題</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>歷屆試題</h1>
    <p class="intro">選一份考卷，依原題號作答。想看題目原貌時，可另開 PDF。</p>

    <div class="panel">
      <div class="filters">
        <label>備考分類
          <select id="exam"><option value="">全部分類</option></select>
        </label>
        <label>科目
          <select id="subject"><option value="">全部科目</option></select>
        </label>
      </div>

      <p id="summary" role="status"></p>
      <div id="results"></div>
    </div>
  </main>

  <script src="papers.js"></script>
  <script>
    const exam = document.getElementById("exam");
    const subject = document.getElementById("subject");
    const summary = document.getElementById("summary");
    const results = document.getElementById("results");

    const loaded = typeof papers !== "undefined" && Array.isArray(papers);
    const allPapers = loaded ? papers : [];

    function addOptions(select, values) {
      for (const value of new Set(values.filter(Boolean))) {
        select.add(new Option(value, value));
      }
    }

    function updateSubjects() {
      const previous = subject.value;
      subject.replaceChildren(new Option("全部科目", ""));
      const matching = allPapers.filter(p => !exam.value || p.exam === exam.value);
      addOptions(subject, matching.map(p => p.subject));

      // 原科目在新分類中仍有考卷才保留，否則自動回到全部科目。
      if ([...subject.options].some(option => option.value === previous)) {
        subject.value = previous;
      }
    }

    function action(label, href, paperName, primary = false, newTab = false) {
      const link = document.createElement("a");
      link.textContent = label;
      link.href = href;
      link.className = primary ? "primary" : "secondary";
      link.setAttribute("aria-label",
        `${label.replace(" ↗", "")}：${paperName}${newTab ? "（另開分頁）" : ""}`);
      if (newTab) {
        link.target = "_blank";
        link.rel = "noopener";
      }
      return link;
    }

    function render() {
      results.replaceChildren();

      if (!loaded) {
        summary.textContent = "無法讀取試卷清單，請確認 papers.js 與本頁放在同一層。";
        return;
      }

      const items = allPapers
        .filter(p => (!exam.value || p.exam === exam.value) &&
                     (!subject.value || p.subject === subject.value))
        .sort((a, b) => b.year - a.year);

      summary.textContent = items.length
        ? `共 ${items.length} 份試卷｜依年度由新到舊排列`
        : "目前沒有符合條件的試卷。";

      for (const p of items) {
        const row = document.createElement("article");
        row.className = "paper";

        const info = document.createElement("div");
        const title = document.createElement("h2");
        const paperName = `${p.year} 年｜${p.title}`;
        title.textContent = paperName;

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = `備考分類：${p.exam} · ${p.subject}`;
        info.append(title, meta);

        const links = document.createElement("div");
        links.className = "actions";

        if (p.quizId) {
          links.append(action("開始作答",
            `quiz.html?paper=${encodeURIComponent(p.quizId)}`, paperName, true));
        }
        if (p.file) {
          links.append(action("查看 PDF ↗", p.file, paperName, !p.quizId, true));
        }
        if (p.answer) {
          links.append(action("參考答案 ↗", p.answer, paperName, false, true));
        }

        row.append(info, links);
        results.append(row);
      }
    }

    addOptions(exam, allPapers.map(p => p.exam));
    updateSubjects();
    render();

    exam.addEventListener("change", () => {
      updateSubjects();
      render();
    });
    subject.addEventListener("change", render);
  </script>
</body>
</html>
